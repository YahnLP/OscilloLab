<script>
/* util.js — outils communs (navigateur et Node) */
(function (g) {
'use strict';
const OL = g.OL = g.OL || {};

/* générateur pseudo-aléatoire reproductible (mulberry32) */
OL.rng = function (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
OL.gauss = function (r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
OL.clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* séquence 1-2-5 */
OL.seq125 = function (min, max) {
  const out = []; let dec = Math.pow(10, Math.floor(Math.log10(min)));
  while (dec <= max * 1.0001) { for (const m of [1, 2, 5]) { const v = m * dec; if (v >= min * 0.9999 && v <= max * 1.0001) out.push(+v.toPrecision(3)); } dec *= 10; }
  return out;
};

/* notation ingénieur française : 1,25 ms ; 2,00 V ; 500 µs */
OL.fmt = function (x, unit, digits) {
  if (x === null || x === undefined || !isFinite(x)) return '****';
  digits = digits || 3;
  if (x === 0) return '0 ' + unit;
  const a = Math.abs(x);
  const pre = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
  let p = pre[pre.length - 1];
  for (const q of pre) { if (a >= q[0] * 0.9999) { p = q; break; } }
  let v = x / p[0];
  let s = v.toPrecision(digits);
  if (s.indexOf('e') >= 0) s = String(+v.toFixed(2));
  return s.replace('.', ',') + ' ' + p[1] + unit;
};
OL.fmtNum = (x, d) => (x === null || !isFinite(x)) ? '****' : x.toFixed(d === undefined ? 2 : d).replace('.', ',');
OL.nearest = function (list, v) { let b = 0; for (let i = 1; i < list.length; i++) if (Math.abs(Math.log(list[i] / v)) < Math.abs(Math.log(list[b] / v))) b = i; return b; };
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* signals.js — sources de signaux : générateur de fonctions et montages.
   Chaque source expose des NOEUDS : source.nodes = { nom: {label, fn(t)->volts} }.
   Les valeurs sont des fonctions pures du temps absolu t (s). */
(function (g) {
'use strict';
const OL = g.OL = g.OL || {};
const TAU = 2 * Math.PI;

/* ---------- formes d'onde élémentaires, phase p dans [0,1[ ---------- */
const wave = {
  sine: p => Math.sin(TAU * p),
  square: (p, d) => (p < d ? 1 : -1),
  triangle: p => (p < 0.5 ? 4 * p - 1 : 3 - 4 * p),
  ramp: (p, d) => { d = d || 0.5; return p < d ? -1 + 2 * p / d : 1 - 2 * (p - d) / (1 - d); },
  pulse: (p, d) => (p < d ? 1 : -1)
};
OL.wave = wave;

/* ---------- Générateur de fonctions (GBF) ---------- */
OL.FuncGen = function (o) {
  const s = Object.assign({ label: 'GBF', shape: 'sine', freq: 1000, amp: 2, offset: 0, duty: 0.5, phase: 0, on: true }, o);
  s.kind = 'funcgen'; s.name = 'Générateur de fonctions';
  const f = t => {
    if (!s.on) return 0;
    let p = (t * s.freq + s.phase / 360) % 1; if (p < 0) p += 1;
    const w = s.shape === 'triangle' ? wave.triangle(p) : s.shape === 'ramp' ? wave.ramp(p, s.duty) : s.shape === 'sine' ? wave.sine(p) : wave.square(p, s.duty);
    return s.offset + 0.5 * s.amp * w;          /* amp = crête à crête */
  };
  s.nodes = { out: { label: 'Sortie GBF', fn: f } };
  s.fhint = () => s.freq;
  return s;
};

/* ---------- Sortie de compensation de sonde (carré 1 kHz) ---------- */
OL.ProbeComp = function (vpp) {
  const s = { kind: 'probecomp', name: 'Sortie de compensation', vpp: vpp || 5, freq: 1000 };
  s.nodes = { out: { label: 'COMP', fn: t => { const p = (t * s.freq) % 1; return p < 0.5 ? s.vpp : 0; } } };
  s.fhint = () => s.freq;
  return s;
};

/* ---------- Pont de diodes : secondaire du transfo -> redressé (+ filtrage éventuel) ---------- */
OL.Bridge = function (o) {
  const s = Object.assign({ kind: 'bridge', name: 'Pont de diodes', veff: 9, freq: 50, vd: 0.7, C: 0, R: 1000, full: true }, o);
  const vm = () => s.veff * Math.SQRT2;
  const sec = t => vm() * Math.sin(TAU * s.freq * t);
  /* sortie : sans condensateur -> |sec| - 2Vd ; avec C -> simulation numérique par pas (cache) */
  const raw = t => { const v = (s.full ? Math.abs(sec(t)) : Math.max(0, sec(t))) - (s.full ? 2 : 1) * s.vd; return Math.max(0, v); };
  let cache = null;
  function build() {
    const T = 1 / s.freq, dt = T / 400, N = Math.round(8 * T / dt) ;
    /* régime établi : on simule 8 périodes et on garde la dernière */
    let vc = 0; const tab = new Float64Array(400);
    const tauD = Math.max(s.R * s.C, 1e-9);
    for (let n = 0; n < N + 400; n++) {
      const t = n * dt, src = raw(t);
      if (src > vc) vc = src; else vc *= Math.exp(-dt / tauD);   /* décharge exponentielle dans R */
      if (n >= N) tab[n - N] = vc;
    }
    cache = { key: [s.veff, s.freq, s.vd, s.C, s.R, s.full].join('|'), tab, T };
  }
  const out = t => {
    if (!(s.C > 0)) return raw(t);
    const key = [s.veff, s.freq, s.vd, s.C, s.R, s.full].join('|');
    if (!cache || cache.key !== key) build();
    let p = (t / cache.T) % 1; if (p < 0) p += 1;
    const x = p * 400, i = Math.floor(x) % 400, j = (i + 1) % 400, fr = x - Math.floor(x);
    return cache.tab[i] * (1 - fr) + cache.tab[j] * fr;
  };
  s.nodes = { sec: { label: 'Secondaire', fn: sec }, out: { label: 'Sortie pont', fn: out } };
  s.fhint = () => s.freq;
  return s;
};

/* ---------- NE555 astable ---------- */
OL.NE555 = function (o) {
  const s = Object.assign({ kind: 'ne555', name: 'NE555 astable', vcc: 9, R1: 1000, R2: 10000, C: 100e-9 }, o);
  const th = () => 0.693 * (s.R1 + s.R2) * s.C, tl = () => 0.693 * s.R2 * s.C;
  s.freq = () => 1 / (th() + tl());
  s.duty = () => th() / (th() + tl());
  const ph = t => { const T = th() + tl(); let x = t % T; if (x < 0) x += T; return x; };
  /* condensateur : monte de Vcc/3 à 2Vcc/3 (charge R1+R2), descend (R2) */

(function (g) {
'use strict';
const OL = g.OL = g.OL || {}, ds = OL.ds, R = OL.rnd, wire = OL.wire;
const choice = (q, opts, ans) => ({ label: q, opts, ans });
const curOn = c => c.U.cur && ((c.U.cur.type !== undefined && c.U.cur.type !== 'off' && c.dev === 'owon') || (c.dev === 'rigol' && c.U.cur.mode !== 'off'));

const stdCh = (c, i, base) => { c.st.ch[i].on = true; c.st.ch[i].probe = 10; c.st.ch[i].vIdx = OL.nearest(c.P.vdivs, base || 0.1); };

OL.TPS.push({

  goal: 'L\'oscilloscope calcule pour toi la fréquence, la tension crête-à-crête, la valeur efficace, le rapport cyclique… Mais il faut <b>savoir les demander</b> et surtout <b>savoir si elles ont un sens</b>.',
  only: ['funcgen.out'],
  setup: c => { const g = c.B.gbf; g.shape = 'square'; g.freq = R.pick(c.r, [1200, 2000, 3000]); g.amp = 5; g.offset = 2.5; g.duty = R.pick(c.r, [0.2, 0.3, 0.4, 0.6]); wire(c, 0, 'funcgen.out'); c.W.ch[0].trim = 0.25; stdCh(c, 0); c.st.tdivIdx = OL.nearest(c.P.tdivs, 0.3 / g.freq); c.st.trig.level = 2.5; },
  steps: [
    { title: 'Afficher des mesures', html: '<p>Règle l\'écran pour voir 2 à 4 périodes, puis affiche les mesures <b>fréquence</b>, <b>tension crête-à-crête</b> et <b>rapport cyclique positif</b>.</p><p>' + ds('<kbd>Measure</kbd> → <kbd>H3</kbd> (Time) → Freq, +Duty ; <kbd>H2</kbd> (Voltage) → Pk-Pk.', '<kbd>Measure</kbd> → touches <b>Horizontal</b> (Freq, +Duty) et <b>Vertical</b> (Vpp). Ou la touche <b>MENU</b> à gauche de l\'écran : mesures rapides.') + '</p>',

    { title: 'Lire et interpréter', html: '<p>Lis les mesures affichées, puis calcule la <b>valeur moyenne</b> et la <b>valeur efficace</b> d\'un signal rectangulaire 0 – 5 V : $\\langle u\\rangle = \\alpha\\,U_{max}$ et $U_{eff} = U_{max}\\sqrt{\\alpha}$ (α = rapport cyclique).'.replace(/\$[^$]*\$/g, m => m.slice(1, -1).replace('\\langle u\\rangle', '<u>').replace('\\alpha\\,U_{max}', 'α·Umax').replace('U_{eff}', 'Ueff').replace('U_{max}\\sqrt{\\alpha}', 'Umax·√α')),

OL.TPS.push({

OL.TPS.push({

<script>
/* teach.js — apport pédagogique : notion à comprendre (learn), pas à pas par appareil (how), coup de pouce (hint).
   how : tableaux de [texte, [identifiants des commandes à faire clignoter]] */
(function (g) {
'use strict';
const OL = g.OL = g.OL || {};
const T = OL.TEACH = {};

/* ---------- COURS « Les bases » ---------- */
OL.LESSONS = [
  { t: 'Ce que fait un oscilloscope', learn: 'Un oscilloscope trace <b>la tension en fonction du temps</b>. L\'axe vertical est la tension (volts), l\'axe horizontal est le temps (secondes). L\'écran est quadrillé en <b>carreaux</b> : 8 en hauteur, 12 en largeur. <b>Tout se lit en comptant des carreaux</b> puis en multipliant par un réglage.' },
  { t: 'La sensibilité verticale : V/div', learn: 'Le réglage <b>V/div</b> (volts par carreau) dit combien de volts vaut un carreau en hauteur. Si V/div = 2 V et que le signal fait 3 carreaux, il mesure 3 × 2 = <b>6 V</b>. <b>Tourner le bouton vers la droite (sens horaire) diminue V/div</b> : le signal grandit à l\'écran.', how: { owon: [['Tourne le bouton VOLTS/DIV de la voie 1 vers la droite : le signal grandit', ['vdiv1']], ['Lis V/div en bas de l\'écran, à côté du numéro de voie', []]], rigol: [['Appuie sur CH1 pour la sélectionner (elle s\'allume)', ['ch1']], ['Tourne le bouton SCALE de la zone VERTICAL vers la droite : le signal grandit', ['vscale']], ['Lis V/div en bas de l\'écran (barre jaune de la voie 1)', []]] } },
  { t: 'La position verticale', learn: 'Le bouton <b>POSITION</b> déplace la trace vers le haut ou le bas <b>sans changer sa valeur</b>. Le petit repère à gauche de l\'écran (flèche numérotée) montre où se trouve <b>0 V</b>. Un appui sur le bouton ramène la trace au centre.', how: { owon: [['Tourne VERTICAL POSITION de la voie 1 : le repère « 1 » monte ou descend', ['vpos1']], ['Appuie sur le bouton : remise à zéro', ['vpos1']]], rigol: [['Tourne POSITION de la zone VERTICAL (voie sélectionnée)', ['vpos']], ['Appuie dessus : remise à zéro', ['vpos']]] } },
  { t: 'La base de temps : s/div', learn: 'Le réglage <b>s/div</b> (secondes par carreau) donne la durée d\'un carreau en largeur. Si s/div = 0,5 ms et qu\'une période occupe 4 carreaux, <b>T = 4 × 0,5 = 2 ms</b>, donc <b>f = 1/T = 500 Hz</b>. Sens horaire = s/div plus petit : le signal s\'étale.', how: { owon: [['Tourne SEC/DIV vers la droite : le signal s\'étale', ['secdiv']], ['Lis la valeur « M : … » en bas de l\'écran', []]], rigol: [['Tourne SCALE de la zone HORIZONTAL vers la droite', ['hscale']], ['Lis la valeur à côté de « H » en haut de l\'écran', []]] } },
  { t: 'La sonde et la masse', learn: 'La sonde a <b>deux contacts</b> : la <b>pointe</b> (sur le point à mesurer) et la <b>pince de masse</b> (sur la masse du circuit, 0 V). Sans pince de masse, il n\'y a pas de mesure fiable. La sonde a aussi un interrupteur <b>×1 / ×10</b> : en ×10 elle divise la tension par 10. <b>L\'oscilloscope doit être réglé sur la même valeur</b>, sinon toutes les tensions affichées sont fausses d\'un facteur 10.' },
  { t: 'Le couplage : DC, AC, GND', learn: '<b>DC</b> : l\'appareil affiche tout le signal (continu + variable). <b>AC</b> : un condensateur retire la partie continue, on voit seulement les variations centrées sur 0 V. <b>GND</b> : l\'entrée est reliée à la masse, la trace plate marque le zéro.', how: { owon: [['Appuie sur CH1 puis sur H1 (Coupling), puis choisis avec les touches F', ['ch1', 'h1', 'f1']]], rigol: [['Appuie sur CH1 puis sur la 1re touche du menu (Coupling) : chaque appui change DC → AC → GND', ['ch1', 'soft1']]] } },
  { t: 'Le déclenchement (trigger)', learn: 'À chaque balayage, l\'oscilloscope doit savoir <b>où commencer</b>. Il attend que le signal <b>franchisse un niveau</b> (LEVEL) <b>dans un sens</b> (pente montante ↗ ou descendante ↘) : c\'est le point de départ, au centre de l\'écran. Si le niveau est <b>en dehors du signal</b>, il n\'y a jamais de déclenchement : l\'image défile (mode Auto) ou se fige (mode Normal).', how: { owon: [['Tourne TRIG LEVEL : le repère de niveau à droite de l\'écran monte ou descend', ['level']], ['Touche 50 % : niveau au milieu du signal', ['p50']]], rigol: [['Tourne LEVEL : le repère de niveau à droite de l\'écran monte ou descend', ['level']], ['Appuie sur LEVEL : niveau remis à 0 V', ['level']]] } },
  { t: 'Mesurer : grille, curseurs, mesures automatiques', learn: 'Trois méthodes : (1) <b>la grille</b> (compter les carreaux, le plus important à l\'examen), (2) les <b>curseurs</b> (deux lignes déplaçables, l\'écart s\'affiche), (3) les <b>mesures automatiques</b> (fréquence, Upp, rapport cyclique… calculés par l\'appareil). Elles doivent donner le même résultat, à la précision de lecture près.', how: { owon: [['Touches Cursor et Measure', ['cursor', 'measure']]], rigol: [['Touches Cursor et Measure', ['cursor', 'measure']]] } }
];

const D = (o, r) => ({ owon: o, rigol: r });
const probeHow = D([['Appuie sur la touche CH1 : le menu de la voie s\'affiche en bas', ['ch1']], ['Appuie sur H4 (Probe) : les choix s\'affichent à droite', ['h4']], ['Appuie sur F2 pour choisir 10X', ['f2']]],
  [['Appuie sur la touche CH1 (elle s\'allume en vert)', ['ch1']], ['Appuie sur la 3e touche du menu à droite de l\'écran (Probe)', ['soft3']], ['Tourne le bouton multifonction jusqu\'à 10X, puis appuie dessus pour valider', ['mf']]]);
const autoHow = D([['Appuie sur Autoset (en haut du pavé de touches)', ['autoset']]], [['Appuie sur AUTO (en haut à droite) : le menu « Auto Setting » apparaît ; le premier choix (Multi-period) convient', ['auto']]]);
const trigSrc = D([['Appuie sur Trigger Menu (zone TRIGGER)', ['trigmenu']], ['H2 (Source) puis F1 pour CH1', ['h2', 'f1']]], [['Appuie sur MENU de la zone TRIGGER', ['trigmenu']], ['2e touche du menu (Source) : appuie jusqu\'à CH1', ['soft2']]]);

T['prise-en-main'] = [
  { learn: 'Une sonde relie le circuit à l\'oscilloscope : la <b>pointe</b> sur le point mesuré, la <b>pince de masse</b> sur la masse. Son interrupteur <b>×10</b> divise la tension par 10 ; l\'appareil doit le savoir pour réafficher la vraie valeur : il faut régler « Probe » sur <b>10X</b> dans le menu de la voie.', how: probeHow, hint: 'Après ce réglage, regarde V/div en bas de l\'écran : il est multiplié par 10 (1 V devient 10 V). C\'est le signe que l\'appareil a compris la sonde.' },
  { learn: '<b>Autoset</b> analyse le signal et règle seul V/div, s/div et le déclenchement. Pratique pour démarrer, mais « pas toujours adapté » : à l\'examen il faut savoir régler <b>à la main</b> (TP 4).', how: autoHow, hint: 'Si rien ne se passe : la voie doit être allumée et le signal doit avoir au moins 20 mV et 20 Hz environ.' },
  { learn: 'Sous la grille, repère <b>V/div</b> et <b>s/div</b>. Hauteur : <b>Upp = carreaux × V/div</b>. Largeur d\'une période : <b>T = carreaux × s/div</b>, puis <b>f = 1/T</b>. Exemple : 4 carreaux de 0,5 ms → T = 2 ms → f = 500 Hz.', how: D([['Compte les carreaux entre le niveau bas et le niveau haut du carré', []], ['Compte les carreaux entre deux fronts montants consécutifs', []]], [['Compte les carreaux entre le niveau bas et le niveau haut du carré', []], ['Compte les carreaux entre deux fronts montants consécutifs', []]]), hint: 'Avec un carré de 5 V (OWON) et V/div = 1 V, tu dois compter 5 carreaux de haut. Et 1 kHz = 1 ms = 5 carreaux à 200 µs/div.' }
];
T['compensation'] = [
  { learn: 'La sonde ×10 est un <b>diviseur</b> auquel on ajoute un petit condensateur réglable : sans lui, le diviseur déforme les <b>fronts</b> d\'un signal carré. On règle la vis jusqu\'à ce que le carré ait des <b>coins nets</b>. <b>Sur-compensée</b> : pic au sommet. <b>Sous-compensée</b> : fronts arrondis.', how: D([['Tourne SEC/DIV jusqu\'à 200 µs/div environ', ['secdiv']], ['Tourne VOLTS/DIV pour que le carré fasse 3 à 5 carreaux de haut', ['vdiv1']], ['Observe les coins du carré', []]], [['Tourne SCALE de la zone HORIZONTAL jusqu\'à 200 µs', ['hscale']], ['Sélectionne CH1 puis tourne SCALE de la zone VERTICAL pour obtenir 3 à 5 carreaux', ['ch1', 'vscale']], ['Observe les coins du carré', []]]), hint: 'Plus la base de temps est rapide, plus le défaut est visible. Regarde le sommet juste après le front montant.' },
  { learn: 'Chaque sonde se règle <b>sur la voie à laquelle elle est reliée</b> (chaque entrée a sa propre capacité). On tourne la vis de la sonde avec un tournevis isolant : ici, avec le curseur « Vis de compensation » du menu <b>Branchements des sondes</b>.', how: D([['Ouvre le menu « Branchements des sondes » au-dessus de l\'oscilloscope', []], ['Déplace le curseur « Vis de compensation » de la sonde 1 jusqu\'à des coins droits', []], ['Fais pareil pour la sonde 2', []]], [['Ouvre le menu « Branchements des sondes » au-dessus de l\'oscilloscope', []], ['Déplace le curseur « Vis de compensation » de la sonde 1 jusqu\'à des coins droits', []], ['Fais pareil pour la sonde 2', []]]), hint: 'Si le carré a un pic, la vis est trop d\'un côté ; s\'il est arrondi, de l\'autre : avance par petits pas en regardant l\'écran.' }
];
T['piege-x1-x10'] = [
  { learn: 'L\'oscilloscope mesure la tension <b>à son entrée</b>. Avec une sonde ×10, elle est <b>10 fois plus petite</b> que celle du circuit. Si l\'appareil croit être en ×1, il affiche cette petite valeur : tout est <b>10 fois trop petit</b>. Les deux réglages (interrupteur et menu) doivent <b>toujours être identiques</b>.', how: autoHow, hint: 'Compare avec le générateur : lis l\'amplitude affichée puis celle réglée sur le générateur (menu « Générateur de fonctions »).' },
  { learn: 'Il suffit de dire à l\'appareil que la sonde est en ×10 : V/div affiché est multiplié par 10 et les mesures redeviennent justes.', how: probeHow, hint: 'Vérifie que V/div a été multiplié par 10 après le réglage Probe.' }
];
T['lecture-graticule'] = [
  { learn: 'Pour lire correctement : (1) le signal doit occuper <b>4 à 7 carreaux</b> en hauteur (sinon la lecture manque de précision), (2) il faut voir <b>2 à 4 périodes</b>, (3) l\'image doit être <b>stable</b> (déclenchement). Rappel : <b>V/div plus petit = signal plus grand</b>.', how: D([['VOLTS/DIV : tourne vers la droite pour agrandir le signal', ['vdiv1']], ['SEC/DIV : tourne vers la droite pour étaler le signal (moins de périodes, plus larges)', ['secdiv']], ['VERTICAL POSITION : centre le signal (appui = zéro)', ['vpos1']], ['TRIG LEVEL : place le niveau au milieu du signal pour le stabiliser', ['level']]], [['CH1 sélectionnée : SCALE vertical vers la droite pour agrandir', ['ch1', 'vscale']], ['SCALE horizontal : vers la droite pour étaler', ['hscale']], ['POSITION vertical : centre le signal', ['vpos']], ['LEVEL : niveau au milieu du signal', ['level']]]), hint: 'Si l\'image défile : le niveau de déclenchement est en dehors du signal. Rapproche-le de la courbe.' },
  { learn: 'Relève les carreaux et <b>multiplie par le réglage</b>. Crête-à-crête = distance entre le point le plus haut et le plus bas. <b>Tension maximale</b> = distance de 0 V au sommet : pour un signal centré, c\'est la moitié de Upp.', hint: 'Exemple : 5,6 carreaux × 1 V/div = 5,6 V. Une période de 4 carreaux à 0,5 ms/div = 2 ms, soit 500 Hz.' }
];
T['couplage'] = [
  { learn: 'Le couplage <b>GND</b> relie l\'entrée à la masse : la trace est plate et marque <b>0 V</b>. Sers-t\'en pour placer le zéro, puis repasse en <b>DC</b> : l\'écart entre le zéro et le milieu du signal est la <b>composante continue</b>.', how: D([['Appuie sur CH1 → H1 (Coupling) → F3 (GND)', ['ch1', 'h1', 'f3']], ['Place la trace sur la ligne centrale avec VERTICAL POSITION (le repère « 1 » se trouve alors au centre)', ['vpos1']], ['Retour en DC : H1 → F1', ['h1', 'f1']]], [['Appuie sur CH1, puis plusieurs fois sur la touche Coupling jusqu\'à GND', ['ch1', 'soft1']], ['Place la trace au centre avec POSITION (appui : zéro)', ['vpos']], ['Appuie encore sur Coupling jusqu\'à DC', ['soft1']]]), hint: 'La valeur moyenne vaut (carreaux entre 0 V et le milieu du signal) × V/div.' },
  { learn: 'En <b>AC</b>, un condensateur retire la composante continue : le signal se recentre sur 0 V. Utile pour voir une <b>petite variation</b> posée sur une grande tension continue (ondulation d\'une alimentation) : on peut alors réduire V/div sans que le signal sorte de l\'écran.', how: D([['CH1 → H1 → F2 (AC)', ['ch1', 'h1', 'f2']]], [['CH1, puis Coupling jusqu\'à AC', ['ch1', 'soft1']]]), hint: 'En AC, la tension maximale d\'un signal sinusoïdal symétrique vaut la moitié de Upp.' }
];
T['declenchement'] = [
  { learn: 'En <b>Auto</b>, l\'appareil dessine même sans déclenchement (image qui défile). En <b>Normal</b>, il attend ; sans déclenchement l\'écran <b>garde la dernière image</b>. Le <b>niveau</b> doit se trouver <b>à l\'intérieur</b> du signal pour qu\'un franchissement existe.', how: D([['Trigger Menu → H5 (Mode) → F2 (Normal)', ['trigmenu', 'h5', 'f2']], ['Tourne TRIG LEVEL pour mettre le repère de niveau au-dessus du signal', ['level']], ['Observe l\'état en haut à gauche de l\'écran : « Ready » (attente)', []]], [['Appuie sur MODE (zone TRIGGER) jusqu\'à ce que le voyant Normal s\'allume', ['mode']], ['Tourne LEVEL pour mettre le repère orange au-dessus du signal', ['level']], ['Observe l\'état en haut à gauche : « WAIT »', []]]), hint: 'Dans l\'appareil, le repère de niveau est la petite flèche sur le bord droit de l\'écran.' },
  { learn: 'La <b>pente</b> choisit le sens du franchissement utilisé : ↗ montante ou ↘ descendante. Avec le niveau placé dans le signal, l\'image devient <b>stable</b> : chaque balayage démarre au même point.', how: D([['Trigger Menu → H4 (Slope) → F2 (descendante)', ['trigmenu', 'h4', 'f2']], ['Touche 50 % : niveau au milieu du signal', ['p50']]], [['MENU (TRIGGER) → 3e touche (Slope) : choisis ↘', ['trigmenu', 'soft3']], ['Tourne LEVEL pour mettre le niveau au milieu du signal', ['level']]]), hint: 'Sur OWON, la touche 50 % place le niveau automatiquement au milieu.' },
  { learn: 'Le point de déclenchement est au <b>centre de l\'écran</b> (repère T en haut). La tension du signal à cet instant est <b>égale au niveau de déclenchement</b> : le niveau est la tension à laquelle le balayage démarre.', how: D([['Tourne TRIG LEVEL pour amener le repère de niveau vers 2 V', ['level']]], [['Tourne LEVEL pour amener le niveau vers 2 V (valeur en haut à droite de l\'écran)', ['level']]]), hint: 'Ici le niveau est affiché en volts : sur le RIGOL, en haut à droite ; sur l\'OWON, en bas à droite.' }
];
T['mesures-auto'] = [
  { learn: 'Les <b>mesures automatiques</b> sont calculées sur ce qui est affiché à l\'écran. Elles sont rapides, mais il faut quelques périodes complètes à l\'écran, un signal bien cadré et une voie allumée. Le <b>rapport cyclique</b> +Duty = durée à l\'état haut / période.', how: D([['Measure → H1 (Add)', ['measure', 'h1']], ['Tourne le bouton M pour choisir le type (Freq, +Duty, Vpp…)', ['m']], ['Appuie sur F4 (Add) pour l\'ajouter à l\'écran', ['f4']], ['Recommence pour chaque mesure (8 au maximum)', []]], [['Appuie sur Measure', ['measure']], ['3e touche (Horizontal) : choisis Freq ou +Duty dans la liste (bouton multifonction puis appui)', ['soft3', 'mf']], ['4e touche (Vertical) : choisis Vpp', ['soft4']], ['Ou : touche MENU à gauche de l\'écran, puis une touche bleue de gauche mesure d\'un appui', ['qm']]]), hint: 'Les mesures s\'affichent en bas de l\'écran (RIGOL) ou en haut à gauche de la grille (OWON). Pour en retirer une, rappuie dessus (RIGOL) ou utilise Remove (OWON).' },
  { learn: 'Pour un signal rectangulaire entre 0 et Umax, de rapport cyclique α : <b>valeur moyenne = α × Umax</b> et <b>valeur efficace = Umax × √α</b>. Compare avec ce que mesure l\'appareil : Vavg et Vrms sont calculées sur <b>tout l\'écran</b> (nombre de périodes pas toujours entier : petit écart possible).', hint: 'Exemple : Umax = 5 V, α = 0,3 → moyenne 1,5 V ; efficace 5 × √0,3 = 2,74 V.' }
];
T['curseurs'] = [
  { learn: 'Il faut un signal bien cadré avant de placer des curseurs : <b>4 à 7 carreaux de haut</b>, <b>2 à 4 périodes</b>.', how: autoHow, hint: 'Utilise le TP 4 pour régler à la main si besoin.' },
  { learn: 'Les <b>curseurs de tension</b> sont deux lignes horizontales : on lit l\'écart <b>ΔU</b> entre elles. Place l\'une sur le sommet, l\'autre sur le creux : ΔU = Upp.', how: D([['Appuie sur Cursor', ['cursor']], ['H1 (Type) → F2 (Voltage)', ['h1', 'f2']], ['Déplace les 2 curseurs avec les 2 boutons VERTICAL POSITION', ['vpos1', 'vpos2']], ['Lis ΔU dans la fenêtre en bas à gauche', []]], [['Appuie sur Cursor', ['cursor']], ['1re touche (Mode) : Manual', ['soft1']], ['2e touche (Type) : Y', ['soft2']], ['Déplace avec le bouton multifonction, après avoir appuyé sur CurA (4e touche) puis CurB (5e touche)', ['soft4', 'soft5', 'mf']], ['Lis ΔY dans la fenêtre', []]]), hint: 'Sur OWON, le curseur 1 suit le bouton POSITION de la voie 1 et le curseur 2 celui de la voie 2.' },
  { learn: 'Les <b>curseurs de temps</b> sont deux lignes verticales : on lit <b>ΔT</b> et <b>1/ΔT</b> (la fréquence). Place-les sur deux points identiques de deux périodes consécutives : ΔT = T.', how: D([['Cursor → H1 (Type) → F3 (Time)', ['cursor', 'h1', 'f3']], ['Déplace les curseurs avec les boutons VERTICAL POSITION', ['vpos1', 'vpos2']]], [['Cursor → 2e touche (Type) : X', ['cursor', 'soft2']], ['4e touche (CurA) puis le bouton multifonction ; 5e touche (CurB) idem', ['soft4', 'soft5', 'mf']]]), hint: 'Prends des points faciles à repérer : les sommets, ou les passages par zéro avec la même pente.' }
];
T['ne555'] = [
  { learn: 'Le <b>NE555 astable</b> fait osciller un condensateur entre 1/3 et 2/3 de la tension d\'alimentation. Il se charge à travers <b>R1 + R2</b> (sortie haute) et se décharge à travers <b>R2</b> (sortie basse) : donc <b>T<sub>H</sub> = 0,693 (R1+R2) C</b>, <b>T<sub>L</sub> = 0,693 R2 C</b>, <b>f = 1/(T<sub>H</sub>+T<sub>L</sub>)</b>.', how: D([['Autoset (ou réglage à la main) pour voir 2 à 4 périodes', ['autoset']], ['Measure → Add → Freq (F4), puis +Duty (F4)', ['measure', 'h1', 'm', 'f4']]], [['AUTO, puis Measure : Horizontal → Freq, +Duty', ['auto', 'measure', 'soft3']]]), hint: 'La sortie du NE555 vaut un peu moins que Vcc à l\'état haut : c\'est normal (environ Vcc − 1,7 V).' },
  { learn: 'Compare mesure et calcul : un petit écart (quelques %) vient de la tolérance des composants et de la lecture. Le rapport cyclique est <b>toujours supérieur à 50 %</b> car la charge passe par R1 + R2, plus longue que la décharge par R2 seule.', hint: 'Convertis bien les unités : R en Ω, C en F, résultat en secondes (1 ms = 0,001 s).' }
];
T['pont-diodes'] = [
  { learn: 'Le secondaire d\'un transformateur délivre une tension alternative. La valeur indiquée est la tension <b>efficace</b> ; la tension <b>maximale</b> vaut <b>Umax = Ueff × √2</b> (≈ 1,414). La fréquence est celle du secteur : 50 Hz, période 20 ms.', how: D([['Règle pour voir 2 périodes : SEC/DIV à 5 ms/div', ['secdiv']], ['Règle VOLTS/DIV pour que le signal occupe 4 à 7 carreaux', ['vdiv1']], ['Lis la tension maximale', []]], [['SCALE horizontal à 5 ms', ['hscale']], ['CH1 sélectionnée : SCALE vertical pour 4 à 7 carreaux', ['ch1', 'vscale']], ['Lis la tension maximale', []]]), hint: 'Astuce pour stabiliser : choisis AC Line comme source de déclenchement (Trigger Menu → Source).' },
  { learn: 'Le <b>pont de diodes</b> redresse : toutes les alternances deviennent positives et la <b>fréquence double</b> (100 Hz). À chaque alternance, deux diodes conduisent en série : chacune « consomme » environ 0,7 V, d\'où <b>Umax sortie ≈ Umax − 1,4 V</b>.', how: D([['Ouvre « Branchements des sondes » et choisis « Pont de diodes — sortie redressée » pour la voie 1', []]], [['Ouvre « Branchements des sondes » et choisis « Pont de diodes — sortie redressée » pour la voie 1', []]]), hint: 'Le signal redressé a une période de 10 ms (100 Hz).' },
  { learn: 'Un <b>condensateur de filtrage</b> se charge sur les crêtes et se décharge lentement : la tension devient presque continue avec une petite <b>ondulation</b>. Pour mesurer cette ondulation, on passe en <b>couplage AC</b> (on retire la tension continue) et on réduit V/div pour l\'agrandir.', how: D([['Ouvre « Montages en entrée » → Pont de diodes → condensateur 470 µF', []], ['CH1 → H1 → F2 (AC)', ['ch1', 'h1', 'f2']], ['VOLTS/DIV vers la droite pour agrandir l\'ondulation', ['vdiv1']]], [['Ouvre « Montages en entrée » → Pont de diodes → condensateur 470 µF', []], ['CH1, puis Coupling jusqu\'à AC', ['ch1', 'soft1']], ['SCALE vertical vers la droite pour agrandir l\'ondulation', ['vscale']]]), hint: 'Ondulation = Upp du signal en couplage AC. Plus C est grand, plus elle est petite.' }
];
T['rc-tau'] = [
  { learn: 'Un condensateur chargé par une résistance suit une <b>exponentielle</b>. La <b>constante de temps τ = R × C</b> est le temps pour atteindre <b>63 %</b> de la tension finale. Au bout de <b>5 τ</b>, la charge est terminée (99 %).', how: D([['Branche CH1 sur E et CH2 sur Uc (déjà fait)', []], ['Règle SEC/DIV pour voir une charge complète sur quelques carreaux', ['secdiv']], ['Allume la voie 2 si besoin avec la touche CH2', ['ch2']]], [['CH2 allumée avec la touche CH2', ['ch2']], ['SCALE horizontal pour voir une charge complète sur quelques carreaux', ['hscale']]]), hint: 'La charge occupe environ 5 τ : choisis s/div de l\'ordre de τ.' },
  { learn: 'Méthode des 63 % : calcule <b>0,63 × E</b>, trouve ce niveau sur la courbe, puis mesure le temps écoulé depuis le <b>début de la charge</b> (début de la montée). Les curseurs rendent la lecture plus précise.', how: D([['Cursor → H1 → F3 (Time) : curseur 1 au début de la montée, curseur 2 au point à 63 %', ['cursor', 'h1', 'f3', 'vpos1', 'vpos2']]], [['Cursor → Mode Manual, Type X : CurA au début de la montée, CurB au point à 63 %', ['cursor', 'soft1', 'soft2', 'soft4', 'soft5']]]), hint: 'Vérifie ensuite que τ mesurée ≈ R × C (R en Ω, C en F).' }
];
T['dephasage'] = [
  { learn: 'Une sonde mal compensée <b>retarde</b> légèrement son signal. Pour mesurer un déphasage (quelques degrés d\'écart), il faut <b>compenser les deux sondes</b> sur la sortie de compensation de l\'appareil.', how: D([['Menu « Branchements des sondes » : mets les voies 1 et 2 sur la sortie de compensation', []], ['Règle 200 µs/div, puis les vis de compensation (TP 2)', ['secdiv']], ['Reviens au filtre : CH1 = entrée, CH2 = sortie', []]], [['Menu « Branchements des sondes » : mets les voies 1 et 2 sur la sortie de compensation', []], ['Règle 200 µs/div, puis les vis de compensation (TP 2)', ['hscale']], ['Reviens au filtre : CH1 = entrée, CH2 = sortie', []]]), hint: 'Les deux sondes doivent donner des coins nets.' },
  { learn: 'Pour comparer deux signaux, on <b>déclenche sur la voie 1</b> (référence) et on superpose les zéros. Les deux traces doivent avoir une amplitude lisible (3 carreaux ou plus).', how: D([['CH2 allumée avec CH2', ['ch2']], ['Trigger Menu → Source = CH1', ['trigmenu', 'h2', 'f1']], ['Place les deux zéros au centre : VERTICAL POSITION de chaque voie (appui = zéro)', ['vpos1', 'vpos2']]], [['CH2 allumée avec CH2', ['ch2']], ['MENU (TRIGGER) → Source = CH1', ['trigmenu', 'soft2']], ['Sélectionne chaque voie avec CH1 / CH2 et appuie sur POSITION pour mettre le zéro au centre', ['ch1', 'ch2', 'vpos']]]), hint: 'Autoset déclenche sur la première voie qui a un signal : ici la voie 1.' },
  { learn: 'Le <b>déphasage</b> est le décalage dans le temps entre deux signaux de même fréquence, exprimé en degrés : <b>φ = 360° × Δt / T</b>. Δt = écart entre deux passages à zéro montants (un par voie) ; T = période. Si le signal de la voie 2 arrive <b>après</b> celui de la voie 1, il est en <b>retard</b> (φ négatif).', how: D([['Cursor → Type Time ; curseur 1 au passage à zéro montant de CH1, curseur 2 à celui de CH2', ['cursor', 'vpos1', 'vpos2']], ['Ou : Measure → Add → « Delay A→B ↑ » → F4', ['measure', 'm', 'f4']]], [['Cursor → Manual, Type X : CurA sur le passage à zéro de CH1, CurB sur celui de CH2', ['cursor', 'mf']], ['Ou : Measure → Horizontal → RDelay, avec Source = CH1 et Source B = CH2', ['measure', 'soft3']]]), hint: 'Exemple : Δt = 90 µs et T = 625 µs → φ = 360 × 90 / 625 = 52°.' }
];
T['xy-lissajous'] = [
  { learn: 'En mode <b>XY</b>, le temps disparaît : la voie 1 déplace le point horizontalement, la voie 2 verticalement. Deux sinus de même fréquence dessinent une <b>ellipse</b> ; la forme dépend du déphasage (droite si en phase, cercle si 90°).', how: D([['Display → H2 (Format) → F2 (XY)', ['display', 'h2', 'f2']], ['Mets les deux positions à 0 (appui sur chaque POSITION) pour centrer l\'ellipse', ['vpos1', 'vpos2']]], [['MENU de la zone HORIZONTAL → 1re touche (Time Base) : XY', ['horizmenu', 'soft1']], ['Mets les positions à 0 pour chaque voie (appui sur POSITION)', ['vpos']]]), hint: 'Ajuste V/div des deux voies pour que l\'ellipse ne sorte pas de l\'écran.' },
  { learn: 'On repère <b>Y<sub>max</sub></b> (demi-hauteur de l\'ellipse) et <b>Y<sub>0</sub></b> (là où l\'ellipse coupe l\'axe vertical, x = 0). Alors <b>sin φ = Y<sub>0</sub> / Y<sub>max</sub></b> : φ = arcsin(Y<sub>0</sub> / Y<sub>max</sub>). Le signe du déphasage ne se lit pas en XY.', hint: 'Exemple : Y0 = 1,5 carreau et Ymax = 3 carreaux → sin φ = 0,5 → φ = 30°.' }
];
T['single-rebonds'] = [
  { learn: 'Un événement unique se capture en <b>Single</b> : l\'appareil attend le déclenchement, enregistre <b>une seule fois</b>, puis s\'arrête (STOP). Il faut régler avant : niveau de déclenchement <b>entre l\'état bas et l\'état haut</b>, pente montante, base de temps adaptée (≈ 500 µs/div).', how: D([['Trigger Menu → H4 : pente ↗ (F1)', ['trigmenu', 'h4', 'f1']], ['TRIG LEVEL : niveau vers 2,5 V', ['level']], ['Appuie sur Single', ['single']]], [['MENU (TRIGGER) → Slope : ↗', ['trigmenu', 'soft3']], ['LEVEL : niveau vers 2,5 V', ['level']], ['Appuie sur SINGLE', ['single']]]), hint: 'L\'état « Ready » (OWON) ou « WAIT » (RIGOL) signifie que l\'appareil attend.' },
  { learn: 'Un interrupteur mécanique <b>rebondit</b> : le contact s\'établit et se coupe plusieurs fois pendant quelques millisecondes avant de se stabiliser. Pour un microcontrôleur, chaque rebond est une impulsion : il compte plusieurs appuis.', how: D([['Ouvre « Montages en entrée » → Bouton poussoir → Appuyer', []]], [['Ouvre « Montages en entrée » → Bouton poussoir → Appuyer', []]]), hint: 'Si l\'appareil ne s\'arrête pas : vérifie le niveau de déclenchement et que Single est bien armé.' },
  { learn: 'La capture est figée : on peut la mesurer tranquillement avec les curseurs. Contre les rebonds : un filtre <b>RC</b> avec porte à trigger de Schmitt, ou un anti-rebond logiciel (ignorer les changements pendant ~20 ms).', how: D([['Cursor → Time : place les curseurs sur le 1er front et sur la fin des rebonds', ['cursor']]], [['Cursor → Manual, Type X : CurA et CurB', ['cursor']]]), hint: 'Compte les paliers à 5 V avant que le signal reste définitivement haut.' }
];
T['bruit-moyenne'] = [
  { learn: 'La sonde <b>×1</b> ne divise pas la tension : c\'est la plus sensible pour les petits signaux (mais bande passante limitée). Le <b>bruit</b> est une petite tension aléatoire que l\'appareil ajoute : il épaissit la trace. Pour voir 6 mV, il faut une sensibilité de 1 à 2 mV/div.', how: D([['VOLTS/DIV vers la droite jusqu\'à 5 mV/div (le minimum de l\'appareil)', ['vdiv1']]], [['Sélectionne CH1, SCALE vertical vers la droite jusqu\'à 2 mV/div', ['ch1', 'vscale']]]), hint: 'Sur l\'OWON, la sensibilité minimale est 5 mV/div ; sur le RIGOL, 1 mV/div.' },

<script>
/* app.js — assemblage : paillasse, oscilloscope, TP, boucle d'animation
   © Yahn LE PRETTRE, Enseignant à la MFR de Pontonx — Licence CC BY-NC-SA 4.0 */
(function (g) {
'use strict';
const OL = g.OL = g.OL || {};
const $ = s => document.querySelector(s);
const App = OL.App = { dev: 'owon', scope: null, ui: null, bench: null, tp: null, seed: 1, rnd: null, tpui: null };

App.makeBench = function () {
  return { gbf: OL.FuncGen({}), comp: null, bridge: OL.Bridge({}), ne555: OL.NE555({}), rc: OL.RCStep({}), rcf: OL.RCFilter({}), dc: OL.DCSource({}), push: OL.PushButton({}) };
};
/* construit un appareil + une paillasse ; tp = null pour le mode libre */
App.build = function (dev, tp, seed) {
  App.dev = dev; App.tp = tp || null; App.seed = seed || 1; const P = OL.PROFILES[dev];
  App.bench = App.makeBench(); App.bench.comp = OL.ProbeComp(P.compVpp); App.rnd = OL.rng(App.seed);
  const box = $('#scopeBox'); box.innerHTML = '';
  const wiring = { ch: [], mism: [1.25, 0.85, 1.12, 0.9] };
  for (let i = 0; i < P.nch; i++) wiring.ch.push({ node: null, sw: 10, trim: 0.5, ground: true });
  App.scope = new OL.Scope(P, wiring);
  App.ui = dev === 'owon' ? new OL.OwonUI(box, App.scope) : new OL.RigolUI(box, App.scope);
  const st = App.scope.st;
  if (tp) { const ctx = OL.tpContext(App, App.rnd); ctx.W = wiring; tp.setup(ctx); }
  else { wiring.ch[0].node = { src: App.bench.comp, key: 'out' }; st.ch[0].probe = 10; st.ch[0].vIdx = OL.nearest(P.vdivs, 0.1); }
  document.body.className = 'body-' + dev;
  document.querySelectorAll('#devSeg button').forEach(b => b.classList.toggle('on', b.dataset.d === dev));
  App.benchUI = new OL.Bench($('#benchPop'), App, tp && tp.only ? { only: tp.only } : {});
  App.fit();
};
App.startTP = function (tp, seed) { App.build(App.dev, tp, seed); };
App.free = function (keepList) { App.build(App.dev, null, 1); if (!keepList) App.tpui.list(); };
App.fit = function () {
  if (!App.ui) return; const w = $('#scopeWrap').clientWidth, bw = App.ui.box.offsetWidth, bh = App.ui.box.offsetHeight, k = Math.min(1.6, w / bw, g.innerWidth > 1250 ? (g.innerHeight - 140) / bh : 9);
  $('#scopeBox').style.transform = 'scale(' + k + ')'; $('#scopeWrap').style.height = (bh * k) + 'px';
};
/* suivi de ce que l'élève a fait (pour la correction automatique) */
function trackLog() {
  const S = App.scope, c0 = S.st.ch[0]; if (!c0) return;
  if (c0.coup === 'gnd') S.log.coupGnd = true; if (c0.coup === 'ac') S.log.coupAc = true;
}
let last = performance.now(), acc = 0, poll = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt; poll += dt;
  if (App.scope && acc >= 0.04) { try { App.scope.tick(acc); App.ui.tickFrame(acc); App.ui.draw(); trackLog(); } catch (e) { console.error(e); } acc = 0; }
  if (poll > 0.35) { poll = 0; if (App.tpui && App.tp) App.tpui.poll(); }
  requestAnimationFrame(loop);
}
g.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#devSeg button').forEach(b => b.addEventListener('click', () => { App.build(b.dataset.d, App.tp, App.seed); if (App.tp) App.tpui.render(); }));
  g.addEventListener('resize', () => App.fit());
  const pop = $('#benchPop'); const show = k => { pop.classList.toggle('open', !!k); pop.querySelectorAll(':scope > div').forEach(d => { d.style.display = d.dataset.p === k ? '' : 'none'; }); document.querySelectorAll('#benchBar button').forEach(b => b.classList.toggle('pri', b.dataset.p === k)); App.pop = k; };
  document.querySelectorAll('#benchBar button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); show(App.pop === b.dataset.p ? null : b.dataset.p); }));
  /* fenêtre déplaçable (par son titre) : on peut la ranger sur le côté pour garder l'écran visible */
  let drag = null;
  pop.addEventListener('pointerdown', e => { const h = e.target.closest('h3'); if (!h) return; const box = h.closest('#benchPop > div'); drag = { box, x: e.clientX, y: e.clientY, l: box.offsetLeft, t: box.offsetTop }; h.setPointerCapture(e.pointerId); h.style.cursor = 'grabbing'; });
  pop.addEventListener('pointermove', e => { if (!drag) return; drag.box.style.left = (drag.l + e.clientX - drag.x) + 'px'; drag.box.style.top = (drag.t + e.clientY - drag.y) + 'px'; });
  pop.addEventListener('pointerup', () => { drag = null; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') show(null); });
  show(null);
  App.tpui = new OL.TPUI($('#tpPane'), App);
  App.build('owon', null, 1); requestAnimationFrame(loop);
});
})(window);

</script>
